<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Productos (CRUD)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">HVAact3_t4</span>
            <span class="text-light">Autor: Alexis Hernández Vázquez</span>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Productos Registrados</h2>
            <a th:href="@{/productos/nuevo}" class="btn btn-warning fw-bold">+ Nuevo Producto</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-primary">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Categoría</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(productos)}">
                            <td colspan="6" class="text-center py-3 text-muted">No hay productos registrados en la base de datos.</td>
                        </tr>
                        <tr th:each="prod : ${productos}">
                            <td th:text="${prod.id}">1</td>
                            <td th:text="${prod.nombre}">Teclado</td>
                            <td th:text="'$' + ${#numbers.formatDecimal(prod.precio, 1, 2)}">$0.00</td>
                            <td th:text="${prod.stock}">0</td>
                            <td>
                                <span class="badge bg-info text-dark" th:text="${prod.categoria != null ? prod.categoria.nombre : 'Sin categoría'}">Electrónica</span>
                            </td>
                            <td>
                                <a th:href="@{/productos/editar/{id}(id=${prod.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                                <a th:href="@{/productos/eliminar/{id}(id=${prod.id})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Seguro que deseas eliminar este producto?');">Eliminar</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
