<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0" th:text="${producto.id != null ? 'Editar Producto' : 'Nuevo Producto'}">Formulario Producto</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
                            <input type="hidden" th:field="*{id}" />

                            <div class="mb-3">
                                <label class="form-label">Nombre del Producto</label>
                                <input type="text" th:field="*{nombre}" class="form-control" required placeholder="Ej. Monitor 27 pulgadas" />
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Precio</label>
                                <input type="number" step="0.01" th:field="*{precio}" class="form-control" required placeholder="Ej. 3500.00" />
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Stock</label>
                                <input type="number" th:field="*{stock}" class="form-control" required placeholder="Ej. 10" />
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Categoría</label>
                                <select name="categoriaId" class="form-select" required>
                                    <option value="" disabled selected>Selecciona una categoría</option>
                                    <option th:each="cat : ${categorias}" 
                                            th:value="${cat.id}" 
                                            th:text="${cat.nombre}"
                                            th:selected="${producto.categoria != null and producto.categoria.id == cat.id}">
                                    </option>
                                </select>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/productos}" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-success">Guardar Producto</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
